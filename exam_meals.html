<!DOCTYPE html>
<html>
  <head>
  </head>
  <body>
    <h1>Exam meals:</h1>
    <form id="form" onsubmit="event.preventDefault(); submitcode();">
        <label for="email">Email address: </label>
        <input type="email" id="email" name="email" required> <br>
        
        <label for="fname">First name: </label>
        <input id="fname" name="fname" required> <br>
        
        <label for="lname">Last name: </label>
        <input id="lname" name="lname" required> <br>
        
        <label for="gender">Gender: </label> 
        <select id="gender" name="gender" required>
            <option value="" hidden>-- Please choose an option --</option>
            <option value="Brother">Brother</option>
            <option value="Sister">Sister</option>
        </select> <br>
        
        <label for="phone">Phone number: </label>
        <input id="phone" name="phone" required> <br>
        
        <label for="diet">Dietary requirements: </label>
        <input id="diet" name="diet"> <br>
        
        <label for="family">Additional family members: </label> 
        <textarea id="family" name="family"></textarea> <br>
        
        <label for="adults">Adults: </label> 
        <input type="number" min="1" max="10" id="adults" name="adults" placeholder="1" required> <br>
        
        <label for="children">Children: </label> 
        <input type="number" min="0" max="10" id="children" name="children" placeholder="0" required> <br>
        
        <fieldset id="meals">
            <legend>Meals: </legend>
            <div>
                <input type="checkbox" name="monday lunch"/>
                <label for="monday lunch">Monday lunch (19/20)</label>
            </div>
            <div>
                <input type="checkbox" name="monday dinner"/>
                <label for="monday dinner">Monday dinner (19/20)</label>
            </div>
        </fieldset>
        
        <fieldset id="cleanup">
            <legend>Cleanup: </legend>
            <div>
                <input type="checkbox" name="monday lunch"/>
                <label for="monday lunch">Monday lunch (19/20)</label>
            </div>
            <div>
                <input type="checkbox" name="monday dinner"/>
                <label for="monday dinner">Monday dinner (19/20)</label>
            </div>
        </fieldset>
        
        <fieldset id="helping">
            <legend>Helping with cooking: </legend>
            <div>
                <input type="checkbox" name="monday lunch"/>
                <label for="monday lunch">Monday lunch (19/20)</label>
            </div>
            <div>
                <input type="checkbox" name="monday dinner"/>
                <label for="monday dinner">Monday dinner (19/20)</label>
            </div>
        </fieldset>
        
        <input type="submit" id="submit" >
    </form>
    <script>
        async function submitcode(){
            let meals = document.getElementById("meals").querySelectorAll('input[type="checkbox"]');
            let cleanup = document.getElementById("cleanup").querySelectorAll('input[type="checkbox"]');
            let onemeal = false, oneclean = false;
            meals.forEach((cb) => {
                if(cb.checked){
                    onemeal = true;
                }
                cb.setCustomValidity("");
            });
            cleanup.forEach((cb) => {
                if(cb.checked){
                    oneclean = true;
                }
                cb.setCustomValidity("");
            });
            if(!onemeal){
                meals[meals.length-1].setCustomValidity("Please select at least one meal");
                meals[meals.length-1].reportValidity();
                document.getElementById("meals").addEventListener('change', (event) => {
                    if(event.target.checked){
                        let meals = document.getElementById("meals").querySelectorAll('input[type="checkbox"]');
                        meals.forEach((cb) => {
                            cb.setCustomValidity("");
                        });
                    }
                });
                return false;
            }
            if(!oneclean){
                cleanup[cleanup.length-1].setCustomValidity("Please select at least one clean up");
                cleanup[cleanup.length-1].reportValidity();
                document.getElementById("cleanup").addEventListener('change', (event) => {
                    if(event.target.checked){
                        let cleanup = document.getElementById("cleanup").querySelectorAll('input[type="checkbox"]');
                        cleanup.forEach((cb) => {
                            cb.setCustomValidity("");
                        });
                    }
                });
                return false;
            }
            if(document.getElementById("form").reportValidity()){ // Valid form
                let email = document.getElementById("email").value;
                let fname = document.getElementById("fname").value;
                let lname = document.getElementById("lname").value;
                let gender = document.getElementById("gender").value;
                let phone = document.getElementById("phone").value;
                let diet = document.getElementById("diet").value;
                let family = document.getElementById("family").value;
                let adults = document.getElementById("adults").value;
                let children = document.getElementById("children").value;
                let helping = document.getElementById("cleanup").querySelectorAll('input[type="checkbox"]');
            }else{ // Invalid form
                return false;
            }
        }
    </script>
  </body>
</html>
