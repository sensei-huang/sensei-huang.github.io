<!DOCTYPE html>
<html>
  <head>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <style>
            :root {
                --accent: #2f6fed;
                --accent-dark: #1f56c4;
                --text: #1f2937;
                --muted: #6b7280;
                --border: #d1d5db;
                --bg: #ffffff;
                --field-bg: #f9fafb;
                --radius: 8px;
            }
            
            .signup-form {
                max-width: 560px;
                margin: 2rem auto;
                padding: 2rem;
                background: var(--bg);
                border-radius: 12px;
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                color: var(--text);
                box-sizing: border-box;
            }
            
            .signup-form *,
            .signup-form *::before,
            .signup-form *::after {
                box-sizing: inherit;
            }
            
            /* Layout */
            .form-group {
                display: flex;
                flex-direction: column;
                gap: 0.35rem;
                margin-bottom: 1.1rem;
                flex: 1;
            }
            
            .form-row {
                display: flex;
                gap: 1rem;
            }
            
            /* Labels */
            .signup-form label,
            .signup-form legend {
                font-size: 0.9rem;
                font-weight: 600;
            }
            
            .optional {
                font-weight: 400;
                color: var(--muted);
            }
            
            /* Inputs */
            .signup-form input:not([type="submit"]):not([type="checkbox"]):not([type="radio"]),
            .signup-form select,
            .signup-form textarea {
                width: 100%;
                padding: 0.65rem 0.8rem;
                font: inherit;
                color: var(--text);
                background: var(--field-bg);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
            }
            
            .signup-form textarea {
                resize: vertical;
                min-height: 80px;
            }
            
            .signup-form input::placeholder,
            .signup-form textarea::placeholder {
                color: #9ca3af;
            }
            
            .signup-form input:focus,
            .signup-form select:focus,
            .signup-form textarea:focus {
                outline: none;
                background: #fff;
                border-color: var(--accent);
                box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.2);
            }
            
            /* Only flag invalid fields after the user has typed in them */
            .signup-form input:not(:placeholder-shown):invalid {
                border-color: #dc2626;
            }
            
            /* Fieldsets (checkbox/radio groups) */
            .signup-form fieldset {
                margin: 0 0 1.1rem;
                padding: 0.9rem 1rem 1rem;
                border: 1px solid var(--border);
                border-radius: var(--radius);
            }
            
            .signup-form legend {
                padding: 0 0.4rem;
            }
            
            /* Lay the options out in a responsive grid */
            .signup-form fieldset {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 0.5rem;
                min-width: 0;
            }
            
            .signup-form legend {
                /* legends sit outside the grid, so keep the padding from before */
                padding: 0 0.4rem;
            }
            
            /* One option */
            .check-option {
                position: relative;
            }
            
            /* Hide the native checkbox visually, but keep it accessible */
            .check-option input[type="checkbox"] {
                position: absolute;
                opacity: 0;
                width: 1px;
                height: 1px;
                margin: 0;
            }
            
            /* The label becomes the clickable pill */
            .signup-form .check-option label {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                padding: 0.55rem 0.8rem;
                font-size: 0.95rem;
                font-weight: 400;
                background: var(--field-bg);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                cursor: pointer;
                user-select: none;
                transition: background 0.15s, border-color 0.15s, color 0.15s;
            }
            
            /* Custom tick box */
            .check-option label::before {
                content: "";
                flex: none;
                width: 1.1rem;
                height: 1.1rem;
                border: 2px solid var(--border);
                border-radius: 4px;
                background: #fff;
                display: grid;
                place-items: center;
                font-size: 0.75rem;
                line-height: 1;
                color: #fff;
                transition: background 0.15s, border-color 0.15s;
            }
            
            .check-option label:hover {
                border-color: var(--accent);
            }
            
            /* Checked state */
            .check-option input:checked + label {
                background: rgba(47, 111, 237, 0.08);
                border-color: var(--accent);
                color: var(--accent-dark);
                font-weight: 600;
            }
            
            .check-option input:checked + label::before {
                content: "✓";
                background: var(--accent);
                border-color: var(--accent);
            }
            
            /* Keyboard focus ring */
            .check-option input:focus-visible + label {
                box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.3);
            }
            
            .signup-form input[type="checkbox"],
            .signup-form input[type="radio"] {
                width: 1.1rem;
                height: 1.1rem;
                accent-color: var(--accent);
                cursor: pointer;
            }
            
            /* Submit button */
            .btn-submit {
                width: 100%;
                margin-top: 0.5rem;
                padding: 0.8rem 1rem;
                font: inherit;
                font-weight: 600;
                color: #fff;
                background: var(--accent);
                border: none;
                border-radius: var(--radius);
                cursor: pointer;
                transition: background 0.15s, transform 0.05s;
            }
            
            .btn-submit:hover:not(:disabled) {
                background: var(--accent-dark);
            }
            
            .btn-submit:active:not(:disabled) {
                transform: translateY(1px);
            }
            
            .btn-submit:focus-visible {
                outline: 3px solid rgba(47, 111, 237, 0.4);
                outline-offset: 2px;
            }
            
            /* Disabled state */
            .btn-submit:disabled {
                background: #d1d5db;
                color: #9ca3af;
                cursor: not-allowed;
                box-shadow: none;
                transform: none;
            }
            
            /* Stack side-by-side fields on small screens */
            @media (max-width: 480px) {
                .signup-form {
                    padding: 1.25rem;
                    margin: 0;
                    border-radius: 0;
                    box-shadow: none;
                }
                .form-row {
                    flex-direction: column;
                    gap: 0;
                }
            }
            
            body {
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                font-size: 1rem;
                line-height: 1.65;
                color: var(--text);
                background: #f3f4f6;
                margin: 0;
                padding: 0 1rem;
            }
            
            h1, h2, h3, h4 {
                font-weight: 700;
                line-height: 1.25;
                letter-spacing: -0.01em;
                color: #111827;
                margin: 2rem 0 0.75rem;
            }
            
            h1 {
                font-size: clamp(1.9rem, 4vw, 2.5rem);
                text-align: center;
                margin-top: 2.5rem;
            }
            
            /* Small accent bar under the main title */
            h1::after {
                content: "";
                display: block;
                width: 56px;
                height: 4px;
                margin: 0.75rem auto 0;
                background: var(--accent);
                border-radius: 2px;
            }
            
            h2 { font-size: 1.5rem; }
            h3 { font-size: 1.2rem; }
            h4 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
            
            p {
                margin: 0 0 1rem;
                max-width: 65ch;          /* keeps lines comfortable to read */
            }
            
            /* Optional: centre intro text under the title by adding class="lead" */
            p.lead {
                font-size: 1.15rem;
                color: var(--muted);
                text-align: center;
                margin: 0 auto 1.5rem;
            }
            
            a {
                color: var(--accent);
                text-underline-offset: 3px;
            }
            
            a:hover {
                color: var(--accent-dark);
            }
        
            .form-intro {
                margin: 0 0 1.75rem;
                padding: 1.1rem 1.25rem;
                background: rgba(47, 111, 237, 0.07);
                border-left: 5px solid var(--accent);
                border-radius: var(--radius);
            }

            .form-intro p {
                max-width: none;          /* use the full card width */
                margin: 0 0 0.6rem;
                font-size: 0.95rem;
                line-height: 1.6;
                color: var(--text);
            }
      </style>
  </head>
  <body>
    <h1>Exam meals:</h1>
    <form id="form" class="signup-form" onsubmit="event.preventDefault(); submitcode();">
    
      <div class="form-intro">
          <p id="intro">
              Please fill in the details below so we can plan food and seating.
              Fields marked <strong>(optional)</strong> can be left blank.
          </p>
      </div>

    <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="john.doe@gmail.com" autocomplete="email" required>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="fname">First name</label>
            <input id="fname" name="fname" placeholder="John" autocomplete="given-name" required>
        </div>
        <div class="form-group">
            <label for="lname">Last name</label>
            <input id="lname" name="lname" placeholder="Doe" autocomplete="family-name" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="" hidden>-- Please choose an option --</option>
                <option value="Brother">Brother</option>
                <option value="Sister">Sister</option>
            </select>
        </div>
        <div class="form-group">
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" placeholder="021 234 5678" autocomplete="tel-national" required>
        </div>
    </div>

    <div class="form-group">
        <label for="diet">Dietary requirements <span class="optional">(optional)</span></label>
        <input id="diet" name="diet">
    </div>

    <div class="form-group">
        <label for="family">Additional family members <span class="optional">(optional)</span></label>
        <textarea id="family" name="family" rows="3"></textarea>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="adults">Adults</label>
            <input type="number" min="1" max="10" id="adults" name="adults" value="1" required>
        </div>
        <div class="form-group">
            <label for="children">Children</label>
            <input type="number" min="0" max="10" id="children" name="children" value="0" required>
        </div>
    </div>

    <fieldset id="meals">
        <legend>Meals</legend>
    </fieldset>

    <fieldset id="cleanup">
        <legend id="cleanuptitle">Cleanup</legend>
    </fieldset>

    <fieldset id="helping">
        <legend>Helping with cooking <span class="optional">(optional)</span></legend>
    </fieldset>

    <input type="submit" id="submit" class="btn-submit" value="Submit">
</form>
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTn6R-QQOUdkxFnMv_OJYCjPV1aWGvuls-p2X4uyw6GETa-Px4KwA2Hotit28D7nR2/exec";
        const daynames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        let days = [];
        let adultcost = 0, childcost = 0, minclean = 0;
        let conc = "";

        // Decryption
        // Helper to turn a raw text key into a CryptoKey object
        async function getCryptoKey(rawKey) {
          const enc = new TextEncoder();
          const keyBuffer = enc.encode(rawKey.padEnd(32, '0').slice(0, 32)); // Ensure 32 bytes for AES-256
          return await window.crypto.subtle.importKey(
            "raw",
            keyBuffer,
            "AES-GCM",
            false,
            ["encrypt", "decrypt"]
          );
        }
        
        async function decryptText(encryptedData, secretKey) {
          const cryptoKey = await getCryptoKey(secretKey);
          const [ivHex, encryptedHex] = encryptedData.split(':');
          
          // Reconstruct IV and Ciphertext byte arrays
          const iv = new Uint8Array(ivHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
          const encryptedBuffer = new Uint8Array(encryptedHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
        
          const decryptedBuffer = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv },
            cryptoKey,
            encryptedBuffer
          );
        
          const dec = new TextDecoder();
          return dec.decode(decryptedBuffer);
        }

        function populateDays(){
            let meals = document.getElementById("meals");
            let cleanup = document.getElementById("cleanup");
            let helping = document.getElementById("helping");
            for(let i = 0; i < days.length; i++){
                let day = `<div class="check-option">
                    <input type="checkbox" name="${days[i]}" id="${days[i] + "meal"}">
                    <label for="${days[i] + "meal"}">${days[i]}</label>
                </div>`;
                meals.insertAdjacentHTML("beforeend", day);
                day = `<div class="check-option">
                    <input type="checkbox" name="${days[i]}" id="${days[i]+"clean"}"/>
                    <label for="${days[i]+"clean"}">${days[i]}</label>
                </div>`;
                cleanup.insertAdjacentHTML("beforeend", day);
                day = `<div class="check-option">
                    <input type="checkbox" name="${days[i]}" id="${days[i]+"helping"}"/>
                    <label for="${days[i]+"helping"}">${days[i]}</label>
                </div>`;
                helping.insertAdjacentHTML("beforeend", day);
            }
        }
      
        async function getParameters(){
          const queryString = window.location.search;
          const urlParams = new URLSearchParams(queryString);
          const enc = urlParams.get('enc');
          const verse = "And you shall know the truth";
          let arguments = await decryptText(enc, verse);
          arguments = arguments.split("|");
          let startdate = new Date(arguments[0]);
          let enddate = new Date(arguments[1]);
          let lunch = arguments[4];
          let dinner = arguments[5];
          while(startdate <= enddate){
            if(lunch.toLowerCase() === "true"){
              days.push(`${daynames[startdate.getDay()]} lunch (${startdate.getDate()}/${startdate.getMonth()+1})`);
            }
            if(dinner.toLowerCase() === "true"){
              days.push(`${daynames[startdate.getDay()]} dinner (${startdate.getDate()}/${startdate.getMonth()+1})`);
            }
            startdate.setDate(startdate.getDate() + 1);
          }
          
          let intro = arguments[6];
          document.getElementById("intro").innerText = intro;
          conc = arguments[7];
          
          adultcost = arguments[2];
          childcost = arguments[3];
          
          minclean = arguments[8];
          if(minclean != 0){
            document.getElementById("cleanuptitle").innerText = `Cleanup (Please select at least ${minclean} ${minclean >= 2 ? "cleanups" : "cleanup"})`;
          }
          populateDays();
          let deadline = new Date(arguments[9]);
          deadline.setHours(0, 0, 0, 0);
          let today = new Date();
          today.setHours(0, 0, 0, 0);
          if(today > deadline){
            const p = document.createElement('p');
            p.innerText = "Sorry, this form is no longer receiving responses as the deadline was on "+deadline.toLocaleDateString('en-GB');
            p.style = "text-align: center;";
            document.getElementById("form").innerHTML = "";
            document.getElementById("form").appendChild(p);
          }
        }
        
        async function submitcode(){
            let meals = document.getElementById("meals").querySelectorAll('input[type="checkbox"]');
            let cleanup = document.getElementById("cleanup").querySelectorAll('input[type="checkbox"]');
            let onemeal = false, cleanups = 0;
            meals.forEach((cb) => {
                if(cb.checked){
                    onemeal = true;
                }
                cb.setCustomValidity("");
            });
            cleanup.forEach((cb) => {
                if(cb.checked){
                    cleanups++;
                }
                cb.setCustomValidity("");
            });
            if(!onemeal){
                meals[meals.length-1].setCustomValidity("Please select at least one meal");
                meals[meals.length-1].reportValidity();
                document.getElementById("meals").addEventListener('change', (event) => {
                    if(event.target.checked){
                        let meals = document.getElementById("meals").querySelectorAll('input[type="checkbox"]');
                        meals.forEach((cb) => {
                            cb.setCustomValidity("");
                        });
                    }
                });
                return false;
            }
            if(cleanups < minclean){
                cleanup[cleanup.length-1].setCustomValidity(`Please select at least ${minclean} ${minclean >= 2 ? "cleanups" : "cleanup"}`);
                cleanup[cleanup.length-1].reportValidity();
                document.getElementById("cleanup").addEventListener('change', (event) => {
                    if(event.target.checked){
                        let cleanup = document.getElementById("cleanup").querySelectorAll('input[type="checkbox"]');
                        cleanup.forEach((cb) => {
                            cb.setCustomValidity("");
                        });
                    }
                });
                return false;
            }
            if(document.getElementById("form").reportValidity()){ // Valid form
                let email = document.getElementById("email").value;
                let fname = document.getElementById("fname").value;
                let lname = document.getElementById("lname").value;
                let gender = document.getElementById("gender").value;
                let phone = document.getElementById("phone").value;
                let diet = document.getElementById("diet").value;
                let family = document.getElementById("family").value;
                let adults = document.getElementById("adults").value;
                let children = document.getElementById("children").value;
                let helping = document.getElementById("helping").querySelectorAll('input[type="checkbox"]');
                
                const formUrl = new URL(SCRIPT_URL);
                let meallist = "", cleanuplist = "", helpinglist = "";
                let mealnum = 0;
                meals.forEach((cb) => {
                    if(cb.checked){
                        mealnum++;
                        if(meallist == ""){
                            meallist += cb.getAttribute("name");
                        }else{
                            meallist += "|"+cb.getAttribute("name");
                        }
                    }
                });
                cleanup.forEach((cb) => {
                    if(cb.checked){
                        if(cleanuplist == ""){
                            cleanuplist += cb.getAttribute("name");
                        }else{
                            cleanuplist += "|"+cb.getAttribute("name");
                        }
                    }
                });
                helping.forEach((cb) => {
                    if(cb.checked){
                        if(helpinglist == ""){
                            helpinglist += cb.getAttribute("name");
                        }else{
                            helpinglist += "|"+cb.getAttribute("name");
                        }
                    }
                });
                const params = {
                    email: email,
                    fname: fname,
                    lname: lname,
                    gender: gender,
                    phone: phone,
                    diet: diet,
                    family: family,
                    adults: adults,
                    children: children,
                    meals: meallist,
                    cleanup: cleanuplist,
                    helping: helpinglist,
                };
                formUrl.search = new URLSearchParams(params);

                document.getElementById("submit").disabled = true; 
                document.getElementById("submit").value = 'Submitting...';
                try{
                    const response = await fetch(formUrl.toString(), {
                        redirect: "follow",
                        method: "GET", 
                        headers: {
                            "Content-Type": "text/plain;charset=utf-8"
                        },
                    });
                    const tex = await response.text();
                    if(tex.split("|")[0] == "ERROR"){ // Error in back end
                        console.log("Error occured from google sheets:"+tex.split("|")[1]);
                        alert("An error occurred while submitting your form! Please try again later or contact the form owners.");
                        document.getElementById("submit").disabled = false;
                        document.getElementById("submit").value = "Submit";
                    }else if(tex == "TIMEOUT"){
                        console.log("Timeout error occurred");
                        alert("The form took too long to submit since too many people are using it at the same time! Please try again.");
                        document.getElementById("submit").disabled = false;
                        document.getElementById("submit").value = "Submit";
                    }else{
                        const p = document.createElement('p');
                        p.innerText = conc.replace("XXX", ((adultcost*adults+childcost*children)*mealnum).toFixed(2));
                        p.style = "text-align: center;";
                        document.getElementById("form").innerHTML = "";
                        document.getElementById("form").appendChild(p);
                    }
                }catch(error){ // Other errors
                    console.error(error.message);
                    alert("An error occurred while submitting your form! Please try again later or contact the form owners.");
                    document.getElementById("submit").disabled = false;
                    document.getElementById("submit").value = "Submit";
                }
            }else{ // Invalid form
                return false;
            }
        }
        getParameters();
    </script>
  </body>
</html>
